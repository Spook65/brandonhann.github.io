</defs><rect width="1440" height="900" fill="#080e18"/><rect width="1440" height="900" fill="url(#hatch)"/><text x="74" y="72" font-size="16" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">LIVING SIGNAL / RELAY CHARACTER STUDY</text><text x="73" y="145" font-size="44" font-weight="750" letter-spacing="-2">A courier for the boundary</text><text x="76" y="183" font-size="18" font-weight="460" >One silhouette: split cap, messenger strap, clear face direction, carried packet.</text><path d="M75 222h287l13 17v272h-300Z" fill="#132238" stroke="#2c506e" stroke-width="2"/><use href="#relay" x="120" y="170" width="190" height="228" /><text x="93" y="451" font-size="12" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">01 / THREE-QUARTER</text><text x="93" y="483" font-size="15" font-weight="500" >Readable face + courier bag</text><path d="M400 222h287l13 17v272h-300Z" fill="#132238" stroke="#2c506e" stroke-width="2"/><use href="#relay-side" x="488" y="175" width="180" height="216" /><path d="M440 386h70M564 386h80" fill="none" stroke="#54a8ff" stroke-width="4" stroke-linecap="square" stroke-linejoin="bevel" /><text x="418" y="451" font-size="12" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">02 / TRAVEL</text><text x="418" y="483" font-size="15" font-weight="500" >Side profile + stride</text><path d="M725 222h287l13 17v272h-300Z" fill="#132238" stroke="#2c506e" stroke-width="2"/><use href="#relay" x="778" y="170" width="188" height="225" /><use href="#packet" x="940" y="273" width="73" height="55" /><path d="M943 312 910 319" fill="none" stroke="#ffc779" stroke-width="8" stroke-linecap="square" stroke-linejoin="bevel" /><text x="743" y="451" font-size="12" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">03 / DELIVERY</text><text x="743" y="483" font-size="15" font-weight="500" >Packet held forward</text><path d="M1050 222h287l13 17v272h-300Z" fill="#132238" stroke="#2c506e" stroke-width="2"/><use href="#relay-denied" x="1108" y="170" width="187" height="226" /><path d="M1275 230v88" fill="none" stroke="#c3adff" stroke-width="12" stroke-linecap="square" stroke-linejoin="bevel" /><path d="M1260 237 1275 220 1290 237" fill="none" stroke="#c3adff" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel" /><text x="1068" y="451" font-size="12" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">04 / POLICY RESPONSE</text><text x="1068" y="483" font-size="15" font-weight="500" >Denied: stop + turn back</text><text x="76" y="579" font-size="13" font-weight="500" class="mono" fill="#9be8cf" style="fill:#9be8cf">ACTUAL-SIZE CHECK / 64 PIXELS</text><use href="#relay" x="88" y="606" width="64" height="77" /><use href="#relay" x="190" y="606" width="64" height="77" /><use href="#relay" x="292" y="606" width="64" height="77" /><text x="383" y="646" font-size="14" font-weight="500" class="mono" fill="#a9b8c8" style="fill:#a9b8c8">Packet bag and blue cap remain identifiable at scene scale.</text><path d="M76 725H1360" fill="none" stroke="#355675" stroke-width="2" stroke-linecap="square" stroke-linejoin="bevel" /><text x="76" y="760" font-size="12" font-weight="500" class="mono" fill="#54a8ff" style="fill:#54a8ff">CHARACTER RULES</text><text x="76" y="799" font-size="17" font-weight="500" >Asymmetric blue cap  ·  warm packet bag  ·  mint eye line  ·  weighted boots</text><text x="76" y="837" font-size="15" font-weight="450" >Static review poses. Final motion and expressions require separate approval.</text></svg>