      <path d="M-27-10 L-7-15 M20-14 L40-6" stroke="#193b56" stroke-width="8" stroke-linecap="round"/>
      <path d="M-77 57 Q-116 75-111 110 L-86 147 L-62 102 M77 53 Q118 64 117 101 L94 140 L66 106" fill="#506997" stroke="#0b2034" stroke-width="9" stroke-linejoin="round"/>
      <path d="M-55 106 Q-5 128 59 100" fill="none" stroke="#dae6eb" stroke-width="8"/>
      <path d="M-47 169 L-50 214 L-79 222 L-89 205 M42 170 L54 213 L82 218 L87 200" fill="#263d61" stroke="#0b2034" stroke-width="9" stroke-linejoin="round"/>
      <path d="M77-50 L103-78 L121-61 L91-29" fill="#8ce5e4" stroke="#0b2034" stroke-width="7"/>
