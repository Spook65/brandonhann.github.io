<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Scout and Sentinel character direction review</title>
  <desc id="desc">Original silhouette studies for a compact courier and protective authorizer, with their facing relationship across a security gate. Concept only, not finished models.</desc>
  <defs>
