    <linearGradient id="scout" x2="0.8" y2="1"><stop stop-color="#ffd6a8"/><stop offset="1" stop-color="#dd8e58"/></linearGradient>
    <linearGradient id="sentinel" x2="0.7" y2="1"><stop stop-color="#c5d4f5"/><stop offset="1" stop-color="#677db7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#05101c" flood-opacity=".5"/></filter>
    <g id="scout-front" filter="url(#shadow)">
