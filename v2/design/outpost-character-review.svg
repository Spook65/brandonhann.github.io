  <rect width="1600" height="900" fill="url(#ground)"/>
  <path d="M0 112 H1600 M0 770 H1600" stroke="#49627a" stroke-width="2"/>
  <text x="68" y="62" fill="#e7f1ef" font-family="Arial, sans-serif" font-size="34" font-weight="800">THE SIGNAL OUTPOST</text>
  <text x="68" y="94" fill="#9fc0d2" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">CHARACTER DIRECTION / CONCEPT REVIEW / NOT FINAL MODELS</text>
  <text x="90" y="172" fill="#ffcc93" font-family="Arial, sans-serif" font-size="25" font-weight="800">01  SCOUT</text>
  <text x="600" y="172" fill="#c5d4f5" font-family="Arial, sans-serif" font-size="25" font-weight="800">02  SENTINEL</text>
  <text x="1090" y="172" fill="#8ce5e4" font-family="Arial, sans-serif" font-size="25" font-weight="800">03  RELATIONSHIP</text>
  <g transform="translate(263 388) scale(1.08)"><use href="#scout-front"/></g>
  <g transform="translate(766 388) scale(1.02)"><use href="#sentinel-front"/></g>
  <text x="90" y="677" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Forward lean · messenger pouch</text>
  <text x="90" y="707" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Short, purposeful gait</text>
  <text x="595" y="677" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Shield silhouette · scanning brow</text>
  <text x="595" y="707" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Open path / stop gesture</text>
  <g transform="translate(1095 312)">
    <path d="M0 183 H396" stroke="#4a7890" stroke-width="29" stroke-linecap="round"/>
    <path d="M194 40 V235 M230 40 V235 M194 40 H230" fill="none" stroke="#b9cff0" stroke-width="15" stroke-linejoin="round"/>
    <path d="M67 150 L119 150" stroke="#ffd1a5" stroke-width="22" stroke-linecap="round"/>
    <path d="M326 150 L277 150" stroke="#cad8f3" stroke-width="22" stroke-linecap="round"/>
    <path d="M133 105 L168 105" stroke="#84e5e2" stroke-width="16" stroke-linecap="round"/>
    <path d="M154 102 L172 102" stroke="#0a2639" stroke-width="4"/>
    <path d="M178 104 L190 104" stroke="#ffd1a5" stroke-width="3" stroke-dasharray="3 5"/>
