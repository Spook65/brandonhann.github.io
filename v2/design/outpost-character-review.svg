    <text x="285" y="40" fill="#cad8f3" font-family="Arial, sans-serif" font-size="18" font-weight="700">← Sentinel</text>
    <text x="116" y="284" fill="#e7f1ef" font-family="Arial, sans-serif" font-size="18">packet → gate → audit</text>
  </g>
  <text x="1090" y="677" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Face each other at inspection</text>
  <text x="1090" y="707" fill="#e6edf0" font-family="Arial, sans-serif" font-size="19">Separate lanes at the gate</text>
  <text x="70" y="812" fill="#b7cbd5" font-family="Arial, sans-serif" font-size="20">Next review: front · side · three-quarter · expression · packet scale at actual camera distance.</text>
  <text x="70" y="852" fill="#8ce5e4" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">ORIGINAL SHAPE STUDY  •  BLENDER SOURCE + OPTIMIZED GLB AFTER DESIGN APPROVAL</text>
</svg>
