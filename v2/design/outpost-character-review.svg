      <path d="M-42 159 L-44 207 Q-74 223-80 207 L-74 192 M40 159 L50 207 Q77 220 83 204 L72 191" fill="#243d53" stroke="#0b2034" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g id="sentinel-front" filter="url(#shadow)">
      <path d="M-79 36 Q-89-45-32-112 Q0-132 35-108 Q88-58 80 31 L65 165 Q9 194-63 165 Z" fill="url(#sentinel)" stroke="#0b2034" stroke-width="9"/>
